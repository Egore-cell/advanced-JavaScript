<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>eShop</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.5.17/dist/vue.js"></script>
</head>

<body>

    <div id="root">
        <header>
            <h1 class="title">eShop</h1>

            <div class="search">
                <input class="goods-search" type="text" v-model="search">
                <button type="button" class="search-button">искать</button>
            </div>

            <div class="action">
                <button class="card-button" type="button" @click="setVisibleCard">Корзина</button>
            </div>

        </header>

        <main class="main">
            <div class="goods-list">
                <div class="goods-item" v-for="item in filteredGoods">
                    <h3>${{item.product_name}}</h3>
                    <p>${{item.price}}</p>
                </div>
            </div>

            <div>{{search}}</div>
            <div v-if="!filteredGoods.length">нет данных</div>
        </main>
        <div>{{calculatePrice}}</div>

        <div class="fixed-area" v-if="isVisibleCard">
            <div class="basket-card">
                <div class="basket-card__header">
                    <h1 class="basket-card__header__title">basket card</h1>
                    <div class="basket-card__header__delete-icon" @click="setVisibleCard"></div>
                </div>

                <div class="basket-card__content">content</div>
            </div>

        </div>
        <script src="script.js"></script>

    </div>


</body>



</html>
